name: CI

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint and format
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Packages the Windows app the same way release.yml does, so a change that breaks the build shows
  # up on its PR instead of on release day. Electrobun only builds Windows on Windows.
  build-windows:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check the installer files exist
        shell: pwsh
        run: |
          $dir = 'apps/windows/build/stable-win-x64'
          foreach ($file in 'AI Usage-Setup.exe', 'AI Usage-Setup.metadata.json', 'AI Usage-Setup.tar.zst') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "Missing $dir/$file" }
          }
          Get-ChildItem $dir | Select-Object Name, Length
