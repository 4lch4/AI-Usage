name: CI

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint and format
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Packages the Windows app the same way release.yml does, so a change that breaks the build shows
  # up on its PR instead of on release day. Electrobun only builds Windows on Windows.
  build-windows:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check the installer files exist
        shell: pwsh
        run: |
          $dir = 'apps/windows/build/stable-win-x64'
          foreach ($file in 'AI Usage-Setup.exe', 'AI Usage-Setup.metadata.json', 'AI Usage-Setup.tar.zst') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "Missing $dir/$file" }
          }
          Get-ChildItem $dir | Select-Object Name, Length

  # Builds a test APK from a fresh `expo prebuild` and keeps it as a workflow artifact so a PR's app
  # can be installed on a phone before merging. It is the release variant, because only that bundles
  # the JavaScript; a debug APK looks for a Metro server and fails with "Unable to load script". Expo's
  # template signs it with the debug key, so it installs but cannot upgrade a properly signed release.
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the native project
        working-directory: apps/android
        run: bunx expo prebuild --platform android --no-install

      - name: Build the test APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v6
        with:
          name: ai-usage-android-test
          path: apps/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Installs the test APK on an emulator and launches it, so a build that crashes on open fails CI
  # instead of on a phone. It also fires the widget's update broadcast, which runs the headless task.
  smoke-android:
    name: Smoke test Android
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the APK
        uses: actions/download-artifact@v6
        with:
          name: ai-usage-android-test
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # As close to the owner's Galaxy S22 Ultra as an emulator gets: its current Android (16, One UI
      # 8) and its default 1080 x 2316 screen at 450 dpi. Samsung's own launcher cannot run here, so
      # the widget is placed with the Pixel launcher.
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2316
          disable-animations: true
          script: bash apps/android/scripts/smoke-test.sh apk/app-release.apk logs

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-usage-android-smoke-logs
          path: logs
          if-no-files-found: ignore
